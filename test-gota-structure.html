<!DOCTYPE html>
<html>
<head>
    <title>Gota.io Structure Test</title>
    <script>
        // This will help us understand how gota.io works
        console.log('Testing gota.io game structure');
        
        // Hook WebSocket to see connections
        const originalWebSocket = window.WebSocket;
        window.WebSocket = function(...args) {
            console.log('[WebSocket] Creating connection to:', args[0]);
            const ws = new originalWebSocket(...args);
            
            ws.addEventListener('open', () => {
                console.log('[WebSocket] Connection opened');
            });
            
            ws.addEventListener('message', (e) => {
                console.log('[WebSocket] Message received:', e.data);
            });
            
            const originalSend = ws.send.bind(ws);
            ws.send = function(data) {
                console.log('[WebSocket] Sending:', data);
                return originalSend(data);
            };
            
            return ws;
        };
    </script>
</head>
<body>
    <h1>Gota.io Test Page</h1>
    <p>Open console to see WebSocket activity</p>
</body>
</html>
